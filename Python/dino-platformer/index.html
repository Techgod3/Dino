<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦕 DinoLand - Prehistoric Platformer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #1a0a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #hud {
            width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #ff6b1a;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
        }

        .hud-item { display: flex; align-items: center; gap: 6px; }
        .hud-item span:first-child { font-size: 20px; }
        #lives-display { color: #ff4444; }
        #score-display { color: #ffd700; }
        #bones-display { color: #f0e68c; }
        #level-display { color: #90ee90; }

        canvas {
            border: 3px solid #ff6b1a;
            border-radius: 0 0 8px 8px;
            display: block;
            image-rendering: pixelated;
        }

        #overlay {
            position: absolute;
            top: 44px;
            left: 0;
            width: 900px;
            height: 500px;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 0 0 8px 8px;
            z-index: 10;
        }

        #overlay h1 {
            font-size: 52px;
            color: #ff6b1a;
            text-shadow: 0 0 20px #ff6b1a, 3px 3px 0 #8b3a00;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
        #overlay .subtitle {
            color: #ffd700;
            font-size: 18px;
            margin-bottom: 30px;
            text-align: center;
        }
        #overlay .controls-info {
            color: #aaa;
            font-size: 13px;
            text-align: center;
            margin-bottom: 30px;
            line-height: 2;
            background: rgba(255,255,255,0.05);
            padding: 14px 30px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        #overlay .controls-info span { color: #fff; font-weight: bold; }
        #start-btn {
            padding: 14px 50px;
            font-size: 22px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            background: linear-gradient(135deg, #ff6b1a, #cc4400);
            color: white;
            border: 3px solid #ffd700;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(255,107,26,0.5);
            position: relative;
            z-index: 20;
        }
        #start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255,107,26,0.8);
            background: linear-gradient(135deg, #ff8844, #ee5500);
        }
        #overlay .deco { font-size: 60px; margin-bottom: 5px; }

        #message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            border: 3px solid #ffd700;
            border-radius: 12px;
            padding: 20px 40px;
            text-align: center;
            z-index: 20;
            display: none;
        }
        #message-box h2 { color: #ffd700; font-size: 28px; margin-bottom: 10px; }
        #message-box p { color: #fff; font-size: 16px; }

        /* ── Shop overlay ────────────────────────────────────────── */
        #shop-overlay {
            position: absolute;
            top: 44px;
            left: 0;
            width: 900px;
            height: 500px;
            background: rgba(8,2,20,0.96);
            display: none;
            align-items: center;
            justify-content: center;
            border-radius: 0 0 8px 8px;
            z-index: 30;
            color: #fff;
            font-family: 'Courier New', monospace;
        }
        .shop-inner {
            width: 860px; max-height: 480px;
            overflow-y: auto;
            padding: 16px 22px;
            text-align: center;
        }
        .shop-title {
            color: #ffd700;
            font-size: 30px;
            letter-spacing: 2px;
            text-shadow: 0 0 12px #ff6b1a;
            margin-bottom: 4px;
        }
        .shop-wallet { color: #f0e68c; font-size: 16px; margin-bottom: 14px; }
        .shop-wallet b { color: #fff; }
        .skin-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }
        .skin-card {
            background: rgba(255,255,255,0.05);
            border: 2px solid #444;
            border-radius: 10px;
            padding: 10px;
            transition: border-color 0.15s, transform 0.15s;
        }
        .skin-card.active { border-color: #ffd700; box-shadow: 0 0 12px rgba(255,215,0,0.45); }
        .skin-card:hover { transform: translateY(-2px); }
        .skin-emoji { font-size: 28px; margin-bottom: 4px; }
        .skin-name { color: #fff; font-size: 14px; font-weight: bold; margin-bottom: 6px; }
        .skin-swatch { display: flex; justify-content: center; gap: 4px; margin-bottom: 8px; }
        .skin-swatch span {
            display: inline-block; width: 16px; height: 16px; border-radius: 50%;
            border: 1px solid #000;
        }
        .shop-btn {
            padding: 6px 12px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            font-weight: bold;
            border: 2px solid #ffd700;
            border-radius: 6px;
            cursor: pointer;
            min-width: 110px;
            color: #fff;
        }
        .shop-btn.equip    { background: linear-gradient(135deg,#2e8b2e,#1c5e1c); }
        .shop-btn.equipped { background: #333; border-color: #666; color: #bbb; cursor: default; }
        .shop-btn.buy      { background: linear-gradient(135deg,#ff6b1a,#cc4400); }
        .shop-btn.locked   { background: #222; border-color: #555; color: #888; cursor: not-allowed; }
        .shop-actions { margin-top: 10px; }
    </style>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
<div id="game-wrapper">
    <div id="hud">
        <div class="hud-item"><span>🦕</span> <span>DinoLand</span></div>
        <div class="hud-item"><span>🦴</span> <span id="bones-display">Bones: 0</span></div>
        <div class="hud-item"><span>⭐</span> <span id="score-display">Score: 0</span></div>
        <div class="hud-item"><span>❤️</span> <span id="lives-display">x5</span></div>
        <div class="hud-item"><span>🌋</span> <span id="level-display">Level 1</span></div>
    </div>
    <canvas id="gameCanvas" width="900" height="500"></canvas>
    <div id="overlay">
        <div class="deco">🦕🦖🌋</div>
        <h1>DINOLAND</h1>
        <div class="subtitle">A Prehistoric Adventure</div>
        <div class="controls-info">
            <span>← →</span> Move &nbsp;|&nbsp; <span>SPACE / ↑</span> Jump (double jump!) &nbsp;|&nbsp; <span>↓</span> Stomp<br>
            Collect <span>🦴 Bones</span> and <span>🥚 Eggs</span> | Stomp enemies to defeat them<br>
            Reach the <span>✨ Exit Portal</span> to advance | Boss fight every 5 levels!
        </div>
        <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px;">
            <button id="start-btn">&#9654; PLAY NOW</button>
            <button id="shop-btn" style="padding:14px 40px;font-size:20px;font-family:Courier New,monospace;font-weight:bold;background:linear-gradient(135deg,#6b3aff,#3a1a88);color:white;border:3px solid #ffd700;border-radius:8px;cursor:pointer;text-transform:uppercase;letter-spacing:2px;box-shadow:0 4px 15px rgba(107,58,255,0.5);">&#128722; SHOP</button>
        </div>
    </div>
    <div id="shop-overlay"></div>
    <div id="message-box">
        <h2 id="msg-title"></h2>
        <p id="msg-body"></p>
    </div>
</div>

<script src="game.js"></script>
<script>
    // Wire up title-screen buttons after everything is loaded
    document.getElementById('start-btn').addEventListener('click', function() {
        if (window.startGame) window.startGame();
    });
    document.getElementById('shop-btn').addEventListener('click', function() {
        if (window.openShop) window.openShop();
    });
</script>
</body>
</html>
